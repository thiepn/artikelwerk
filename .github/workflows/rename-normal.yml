name: One-time vocabulary track rename

on:
  push:
    branches:
      - v2-3-bridge-certification

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: v2-3-bridge-certification
          fetch-depth: 0

      - name: Rename product-facing track copy
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          changed = []
          for raw in paths:
              if not raw or raw.startswith('.github/workflows/'):
                  continue
              path = Path(raw)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              updated = text.replace('Bridge', 'Normal')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(raw)

          print(f'Renamed product copy in {len(changed)} tracked text files.')
          for path in changed:
              print(path)

      - name: Commit product rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- ':!.github/workflows/**'
          if git diff --cached --quiet; then
            echo "No rename changes required."
            exit 0
          fi
          git commit -m "Rename Bridge vocabulary track to Normal"
          git push origin HEAD:v2-3-bridge-certification
