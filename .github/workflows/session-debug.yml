name: Inspect session completion and repeat selection

on:
  push:
    branches: [codex/session-finish-repeat-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print final-check and retry source contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=[
            'nextFinalCheckOrEnd',
            'finalCheckQueue',
            'finalCheckCursor',
            'questionKind==="finalCheck"',
            'questionKind==="shortRetry"',
            'shortRetries.set',
            'popDueShortRetry',
            'answer(article',
            'end(){',
            '#nextBtn").addEventListener',
          ]
          for needle in needles:
              print('\n'+'='*30, needle, '='*30)
              start=0; found=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  found+=1
                  a=max(0,i-3000); b=min(len(s),i+6500)
                  print(f'-- occurrence {found} at char {i} --')
                  print(s[a:b])
                  start=i+len(needle)
                  if found>=6: break
          PY
