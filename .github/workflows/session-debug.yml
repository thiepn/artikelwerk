name: Inspect session completion and repeat selection

on:
  push:
    branches: [codex/session-finish-repeat-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print compact state-machine contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          needles=['nextFinalCheckOrEnd','answer(article','shortRetries.set','questionKind==="shortRetry"','questionKind==="finalCheck"','end(){','nextBtn").addEventListener']
          shown=set()
          for needle in needles:
              hits=[i for i,l in enumerate(lines) if needle in l]
              print(f'\n### {needle}: {[i+1 for i in hits]}')
              for i in hits[:3]:
                  key=(max(0,i-18),min(len(lines),i+75))
                  if key in shown: continue
                  shown.add(key)
                  a,b=key
                  for n in range(a,b): print(f'{n+1:05d}: {lines[n]}')
          PY
