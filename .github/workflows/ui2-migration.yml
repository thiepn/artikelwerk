name: Apply UI2 app shell

on:
  push:
    branches:
      - codex/ui2-app-shell
    paths:
      - scripts/ui2-migrate.py
      - .github/workflows/ui2-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artikelwerk-ui2-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply UI2 migration
        run: python scripts/ui2-migrate.py

      - name: Remove staged migration script
        run: rm -f scripts/ui2-migrate.py

      - name: Install pinned browser-test runtime
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Verify source, content, shell, and deterministic artifact
        run: npm run ci:static

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run practice, content, and shell browser suites
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/artikelwerk-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:content-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:shell-browser

      - name: Exclude workflow mutation from bot commit
        run: git checkout HEAD -- .github/workflows/ui2-migration.yml

      - name: Commit UI2 shell
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement UI2 app shell and hierarchy"
          git push origin HEAD:codex/ui2-app-shell
