name: Decode editable app source

on:
  push:
    branches:
      - codex/dedicated-practice-screen
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract valid source prefix and locate archive damage
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          encoded_with_padding = ''.join(
              ''.join(character for character in path.read_text(encoding='utf-8-sig') if character in alphabet)
              for path in sorted(Path('payload').glob('[0-9][0-9].txt'))
          )
          encoded = encoded_with_padding.rstrip('=')

          # The archive has exactly one missing base64 data character. Appending a
          # harmless probe character makes the bytes decodable while preserving
          # the valid prefix up to the missing position.
          probe = encoded + 'A'
          probe += '=' * (-len(probe) % 4)
          compressed = base64.b64decode(probe, validate=True)

          decompressor = zlib.decompressobj(31)
          output = bytearray()
          error_byte = None
          error_message = 'none'

          for index, value in enumerate(compressed):
              try:
                  output.extend(decompressor.decompress(bytes((value,))))
              except zlib.error as error:
                  error_byte = index
                  error_message = str(error)
                  break

          if error_byte is None:
              try:
                  output.extend(decompressor.flush())
              except zlib.error as error:
                  error_message = str(error)
              error_byte = len(compressed)

          partial_text = output.decode('utf-8', errors='replace')
          Path('partial-source.html').write_text(partial_text, encoding='utf-8')

          lines = partial_text.splitlines()
          terms = (
              'practice', 'üben', 'training', 'quiz', 'definition',
              'translation', 'meaning', 'article', 'session', 'answer',
              'explanation', 'scrollintoview', 'feedback'
          )
          matches = []
          for number, line in enumerate(lines, 1):
              lowered = line.lower()
              if any(term.lower() in lowered for term in terms):
                  matches.append(f'{number}: {line[:1400]}')
          Path('source-index.txt').write_text('\n'.join(matches) + '\n', encoding='utf-8')

          estimated_base64_index = (error_byte // 3) * 4
          chunk_08_start = sum(
              len(path.read_text(encoding='utf-8-sig'))
              for path in sorted(Path('payload').glob('[0-7][0-9].txt'))
              if path.name <= '07.txt'
          )
          Path('source-metadata.txt').write_text(
              f'encoded_data_chars={len(encoded)}\n'
              f'compressed_probe_bytes={len(compressed)}\n'
              f'partial_source_bytes={len(output)}\n'
              f'partial_source_lines={len(lines)}\n'
              f'first_error_compressed_byte={error_byte}\n'
              f'estimated_missing_base64_index={estimated_base64_index}\n'
              f'chunk_08_start={chunk_08_start}\n'
              f'estimated_offset_inside_chunk_08={estimated_base64_index - chunk_08_start}\n'
              f'zlib_error={error_message}\n',
              encoding='utf-8',
          )
          print(Path('source-metadata.txt').read_text(encoding='utf-8'))
          PY

      - name: Commit recovery diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partial-source.html source-index.txt source-metadata.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: locate archived source corruption"
          git push
