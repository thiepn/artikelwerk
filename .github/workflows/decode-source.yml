name: Decode editable app source

on:
  push:
    branches:
      - codex/dedicated-practice-screen
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify application payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import zlib
          from pathlib import Path

          BASE64_DATA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          allowed = set(BASE64_DATA + '=')
          paths = sorted(Path('payload').glob('[0-9][0-9].txt'))
          parts = []
          boundaries = []
          running = 0

          for path in paths:
              raw_bytes = path.read_bytes()
              raw_text = raw_bytes.decode('utf-8-sig')
              clean = ''.join(character for character in raw_text if character in allowed)
              parts.append(clean)
              running += len(clean)
              boundaries.append(running)
              print(
                  f'{path}: bytes={len(raw_bytes)} chars={len(raw_text)} '
                  f'base64={len(clean)} mod4={len(clean) % 4} '
                  f'head={clean[:8]!r} tail={clean[-8:]!r}'
              )

          encoded = ''.join(parts).rstrip('=')
          print(f'joined_data_chars={len(encoded)} mod4={len(encoded) % 4}')

          def decode(candidate):
              if len(candidate) % 4 == 1:
                  return None
              padded = candidate + ('=' * (-len(candidate) % 4))
              try:
                  compressed = base64.b64decode(padded, validate=True)
                  if not compressed.startswith(b'\x1f\x8b'):
                      return None
                  text = gzip.decompress(compressed).decode('utf-8')
              except (ValueError, OSError, UnicodeDecodeError, zlib.error):
                  return None
              if '<!doctype html' not in text.lower() or '</html>' not in text.lower():
                  return None
              return text

          text = decode(encoded)
          repair = 'none'

          positions = {0, len(encoded)}
          for boundary in boundaries[:-1]:
              for offset in range(-12, 13):
                  position = boundary + offset
                  if 0 <= position <= len(encoded):
                      positions.add(position)
          for position in range(max(0, len(encoded) - 24), len(encoded) + 1):
              positions.add(position)

          if text is None and len(encoded) % 4 == 1:
              for position in sorted(position for position in positions if position < len(encoded)):
                  candidate = encoded[:position] + encoded[position + 1:]
                  text = decode(candidate)
                  if text is not None:
                      repair = f'removed {encoded[position]!r} at data index {position}'
                      break

          if text is None and len(encoded) % 4 == 1:
              for position in sorted(positions):
                  for character in BASE64_DATA:
                      candidate = encoded[:position] + character + encoded[position:]
                      text = decode(candidate)
                      if text is not None:
                          repair = f'inserted {character!r} at data index {position}'
                          break
                  if text is not None:
                      break

          if text is None:
              raise RuntimeError('Unable to recover and verify compressed application payload')

          print(f'payload_repair={repair}')
          source = Path('app-source.html')
          source.write_text(text, encoding='utf-8')
          lines = text.splitlines()
          terms = (
              'practice', 'üben', 'training', 'quiz', 'definition',
              'translation', 'meaning', 'article', 'session', 'answer'
          )

          matches = []
          for number, line in enumerate(lines, 1):
              lowered = line.lower()
              if any(term.lower() in lowered for term in terms):
                  matches.append(f'{number}: {line[:1000]}')

          Path('source-index.txt').write_text('\n'.join(matches) + '\n', encoding='utf-8')
          Path('source-metadata.txt').write_text(
              f'bytes={len(text.encode("utf-8"))}\n'
              f'lines={len(lines)}\n'
              f'payload_repair={repair}\n',
              encoding='utf-8',
          )
          PY

      - name: Commit decoded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-source.html source-index.txt source-metadata.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: expose editable application source"
          git push
