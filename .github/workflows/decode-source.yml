name: Decode editable app source

on:
  push:
    branches:
      - codex/dedicated-practice-screen
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode application payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          encoded = ''.join(
              path.read_text(encoding='utf-8')
              for path in sorted(Path('payload').glob('[0-9][0-9].txt'))
          )
          encoded = ''.join(character for character in encoded if character in alphabet)
          encoded += '=' * (-len(encoded) % 4)
          compressed = base64.b64decode(encoded, validate=False)
          text = gzip.decompress(compressed).decode('utf-8')

          source = Path('app-source.html')
          source.write_text(text, encoding='utf-8')
          lines = text.splitlines()
          terms = (
              'practice', 'üben', 'training', 'quiz', 'definition',
              'translation', 'meaning', 'article', 'session', 'answer'
          )

          matches = []
          for number, line in enumerate(lines, 1):
              lowered = line.lower()
              if any(term.lower() in lowered for term in terms):
                  matches.append(f'{number}: {line[:800]}')

          Path('source-index.txt').write_text('\n'.join(matches) + '\n', encoding='utf-8')
          Path('source-metadata.txt').write_text(
              f'bytes={len(text.encode("utf-8"))}\nlines={len(lines)}\n',
              encoding='utf-8',
          )
          PY

      - name: Commit decoded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-source.html source-index.txt source-metadata.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: expose editable application source"
          git push
