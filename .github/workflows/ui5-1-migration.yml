name: Apply UI5.1 visual acceptance fixes

on:
  push:
    branches:
      - codex/ui5-1-visual-acceptance-fixes
    paths:
      - scripts/ui5-1-migrate.py
      - tests/visual-acceptance.mjs
      - docs/ui5-1-visual-acceptance.md
      - .github/workflows/ui5-1-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artikelwerk-ui5-1-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply UI5.1 acceptance fixes
        shell: bash
        run: |
          python -m py_compile scripts/ui5-1-migrate.py
          python scripts/ui5-1-migrate.py

      - name: Install pinned browser-test runtime
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Verify source, content, acceptance contract, and deterministic artifact
        run: npm run ci:static

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full browser and UI5.1 acceptance certification
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/artikelwerk-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:content-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:shell-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:surfaces-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:a11y-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:editorial-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:visual-acceptance-browser

      - name: Upload UI5.1 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: artikelwerk-ui5-1-evidence
          path: test-artifacts/ui5-1/
          if-no-files-found: error
          retention-days: 14

      - name: Remove staging script
        run: rm -f scripts/ui5-1-migrate.py

      - name: Exclude workflow mutation from bot commit
        run: git checkout HEAD -- .github/workflows/ui5-1-migration.yml

      - name: Commit certified UI5.1 fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve UI5 visual acceptance blockers"
          git push origin HEAD:codex/ui5-1-visual-acceptance-fixes
