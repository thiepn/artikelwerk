name: One-time Normal gloss provenance repair

on:
  push:
    branches:
      - v2-3-bridge-certification

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: v2-3-bridge-certification
          fetch-depth: 0

      - name: Repair materialized runtime provenance and certification
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('scripts/materialize-bridge-v23.mjs', "  const oldProvenance = effectiveProvenanceEntries[oldId];\n  if (!oldProvenance) fail(`Missing source provenance for replaced Normal entry ${oldId}.`);\n  delete effectiveTranslations[oldId];\n  delete effectiveTranslationProvenance[oldId];\n", "  const oldProvenance = effectiveProvenanceEntries[oldId];\n  const oldTranslationProvenance = effectiveTranslationProvenance[oldId] || {};\n  if (!oldProvenance) fail(`Missing source provenance for replaced Normal entry ${oldId}.`);\n  delete effectiveTranslations[oldId];\n  delete effectiveTranslationProvenance[oldId];\n", 'capture replacement source translation provenance')
          replace_once('scripts/materialize-bridge-v23.mjs', "  effectiveTranslationProvenance[s.id] = Object.freeze({\n    source: 'v23-editorial-review',\n    sourceKind: 'wiktionary-bridge-editorial',\n    materializedFrom: oldId,\n    editorialDecision: 'replace',\n    reviewedSenseIds: review.reviewedSenseIds,\n    componentReview: review.componentReview,\n    b1LowerBoundCheck: review.b1LowerBoundCheck,\n  });\n", "  effectiveTranslationProvenance[s.id] = Object.freeze({\n    source: 'v23-editorial-review',\n    sourceKind: 'wiktionary-bridge-editorial',\n    sourceStatus: oldTranslationProvenance.reviewStatus || 'source-certified',\n    reviewStatus: replacementReleaseReviewed(review) ? 'release-reviewed' : 'partial-editorial',\n    materializedFrom: oldId,\n    editorialDecision: 'replace',\n    reviewedSenseIds: review.reviewedSenseIds,\n    componentReview: review.componentReview,\n    b1LowerBoundCheck: review.b1LowerBoundCheck,\n  });\n", 'replacement runtime review status')
          replace_once('scripts/materialize-bridge-v23.mjs', "  effectiveTranslationProvenance[id] = Object.freeze({\n    ...(sourceTranslationProvenance[id] || {}),\n    editorialSource: 'v23-editorial-review',\n    editorialDecision: 'retain',\n    reviewedSenseIds: review.reviewedSenseIds || [],\n    componentReview: retainedComponents(review),\n  });\n", "  effectiveTranslationProvenance[id] = Object.freeze({\n    ...(sourceTranslationProvenance[id] || {}),\n    sourceStatus: sourceTranslationProvenance[id]?.reviewStatus || 'source-certified',\n    reviewStatus: retainedReleaseReviewed(review) ? 'release-reviewed' : 'partial-editorial',\n    editorialSource: 'v23-editorial-review',\n    editorialDecision: 'retain',\n    reviewedSenseIds: review.reviewedSenseIds || [],\n    componentReview: retainedComponents(review),\n  });\n", 'retained runtime review status')
          replace_once('scripts/certify-bridge-v23.mjs', "  if (!translation.translations[id]) fail(`Missing materialized translation for ${id}`);\n  if (!translation.provenance[id]) fail(`Missing materialized translation provenance for ${id}`);\n  if (!provenance.entries?.[id]) fail(`Missing materialized content provenance for ${id}`);\n", "  if (!translation.translations[id]) fail(`Missing materialized translation for ${id}`);\n  if (!translation.provenance[id]) fail(`Missing materialized translation provenance for ${id}`);\n  const runtimeTranslationReview = translation.provenance[id];\n  if (runtimeTranslationReview.sourceStatus !== 'source-certified') fail(`Runtime translation source status is not source-certified for ${id}`);\n  if (runtimeTranslationReview.reviewStatus !== 'release-reviewed') fail(`Runtime translation review status is not release-reviewed for ${id}`);\n  if (!Array.isArray(runtimeTranslationReview.reviewedSenseIds) || runtimeTranslationReview.reviewedSenseIds.length < 1) fail(`Runtime translation lacks reviewed sense metadata for ${id}`);\n  if (!['gloss', 'example', 'rule', 'level'].every((component) => runtimeTranslationReview.componentReview?.[component] === 'editorial')) fail(`Runtime translation component review is incomplete for ${id}`);\n  if (!provenance.entries?.[id]) fail(`Missing materialized content provenance for ${id}`);\n", 'hard runtime translation release gate')

      - name: Refresh certified Normal runtime assets
        run: |
          set -euo pipefail
          node scripts/materialize-bridge-v23.mjs
          cp .generated-v23/bridge-corpus.js normal-corpus.js
          cp .generated-v23/bridge-translations.js normal-translations.js
          node scripts/certify-bridge-v23.mjs

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- ':!.github/workflows/**'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No repair changes required.'; exit 0; }
          git commit -m "Fix Normal release-reviewed gloss provenance"
          git push origin HEAD:v2-3-bridge-certification
