name: One-time Normal gloss provenance repair

on:
  push:
    branches:
      - v2-3-bridge-certification

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: v2-3-bridge-certification
          fetch-depth: 0

      - name: Repair materialized runtime provenance and certification
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'scripts/materialize-bridge-v23.mjs',
              """  const oldProvenance = effectiveProvenanceEntries[oldId];
  if (!oldProvenance) fail(`Missing source provenance for replaced Normal entry ${oldId}.`);
  delete effectiveTranslations[oldId];
  delete effectiveTranslationProvenance[oldId];
""",
              """  const oldProvenance = effectiveProvenanceEntries[oldId];
  const oldTranslationProvenance = effectiveTranslationProvenance[oldId] || {};
  if (!oldProvenance) fail(`Missing source provenance for replaced Normal entry ${oldId}.`);
  delete effectiveTranslations[oldId];
  delete effectiveTranslationProvenance[oldId];
""",
              'capture replacement source translation provenance',
          )

          replace_once(
              'scripts/materialize-bridge-v23.mjs',
              """  effectiveTranslationProvenance[s.id] = Object.freeze({
    source: 'v23-editorial-review',
    sourceKind: 'wiktionary-bridge-editorial',
    materializedFrom: oldId,
    editorialDecision: 'replace',
    reviewedSenseIds: review.reviewedSenseIds,
    componentReview: review.componentReview,
    b1LowerBoundCheck: review.b1LowerBoundCheck,
  });
""",
              """  effectiveTranslationProvenance[s.id] = Object.freeze({
    source: 'v23-editorial-review',
    sourceKind: 'wiktionary-bridge-editorial',
    sourceStatus: oldTranslationProvenance.reviewStatus || 'source-certified',
    reviewStatus: replacementReleaseReviewed(review) ? 'release-reviewed' : 'partial-editorial',
    materializedFrom: oldId,
    editorialDecision: 'replace',
    reviewedSenseIds: review.reviewedSenseIds,
    componentReview: review.componentReview,
    b1LowerBoundCheck: review.b1LowerBoundCheck,
  });
""",
              'replacement runtime review status',
          )

          replace_once(
              'scripts/materialize-bridge-v23.mjs',
              """  effectiveTranslationProvenance[id] = Object.freeze({
    ...(sourceTranslationProvenance[id] || {}),
    editorialSource: 'v23-editorial-review',
    editorialDecision: 'retain',
    reviewedSenseIds: review.reviewedSenseIds || [],
    componentReview: retainedComponents(review),
  });
""",
              """  effectiveTranslationProvenance[id] = Object.freeze({
    ...(sourceTranslationProvenance[id] || {}),
    sourceStatus: sourceTranslationProvenance[id]?.reviewStatus || 'source-certified',
    reviewStatus: retainedReleaseReviewed(review) ? 'release-reviewed' : 'partial-editorial',
    editorialSource: 'v23-editorial-review',
    editorialDecision: 'retain',
    reviewedSenseIds: review.reviewedSenseIds || [],
    componentReview: retainedComponents(review),
  });
""",
              'retained runtime review status',
          )

          replace_once(
              'scripts/certify-bridge-v23.mjs',
              """  if (!translation.translations[id]) fail(`Missing materialized translation for ${id}`);
  if (!translation.provenance[id]) fail(`Missing materialized translation provenance for ${id}`);
  if (!provenance.entries?.[id]) fail(`Missing materialized content provenance for ${id}`);
""",
              """  if (!translation.translations[id]) fail(`Missing materialized translation for ${id}`);
  if (!translation.provenance[id]) fail(`Missing materialized translation provenance for ${id}`);
  const runtimeTranslationReview = translation.provenance[id];
  if (runtimeTranslationReview.sourceStatus !== 'source-certified') fail(`Runtime translation source status is not source-certified for ${id}`);
  if (runtimeTranslationReview.reviewStatus !== 'release-reviewed') fail(`Runtime translation review status is not release-reviewed for ${id}`);
  if (!Array.isArray(runtimeTranslationReview.reviewedSenseIds) || runtimeTranslationReview.reviewedSenseIds.length < 1) fail(`Runtime translation lacks reviewed sense metadata for ${id}`);
  if (!['gloss', 'example', 'rule', 'level'].every((component) => runtimeTranslationReview.componentReview?.[component] === 'editorial')) {
    fail(`Runtime translation component review is incomplete for ${id}`);
  }
  if (!provenance.entries?.[id]) fail(`Missing materialized content provenance for ${id}`);
""",
              'hard runtime translation release gate',
          )

      - name: Refresh certified Normal runtime assets
        run: |
          set -euo pipefail
          node scripts/materialize-bridge-v23.mjs
          cp .generated-v23/bridge-corpus.js normal-corpus.js
          cp .generated-v23/bridge-translations.js normal-translations.js
          node scripts/certify-bridge-v23.mjs

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- ':!.github/workflows/**'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No repair changes required.'; exit 0; }
          git commit -m "Fix Normal release-reviewed gloss provenance"
          git push origin HEAD:v2-3-bridge-certification
