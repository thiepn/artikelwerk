name: One-time final Normal product copy cleanup

on:
  push:
    branches:
      - v2-3-bridge-certification

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: v2-3-bridge-certification
          fetch-depth: 0

      - name: Finalize B2–C2 product metadata and naming guard
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('index.html','<meta name="description" content="A focused C1/C2 German noun-gender trainer with adaptive review, contextual practice, and productive recall." />','<meta name="description" content="A focused B2–C2 German noun-gender trainer with Normal and Challenge vocabulary, adaptive review, contextual practice, and productive recall." />','document description')
          replace_once('index.html','<title>Artikelwerk — C1/C2 German Article Trainer</title>','<title>Artikelwerk — B2–C2 German Article Trainer</title>','document title')
          replace_once('index.html','<div class="brand-copy"><h1>Artikelwerk</h1><p>German noun gender · C1/C2</p></div>','<div class="brand-copy"><h1>Artikelwerk</h1><p>German noun gender · B2–C2</p></div>','header range')
          replace_once('scripts/verify-source.mjs',"requireFragment(html, '<title>Artikelwerk', 'application title');\n","requireFragment(html, '<title>Artikelwerk — B2–C2 German Article Trainer</title>', 'B2–C2 application title');\nrequireFragment(html, 'German noun gender · B2–C2', 'B2–C2 header coverage');\nrequireFragment(html, 'Normal · B2–C1', 'Normal product label');\nif (/\\bBridge\\b/.test(html)) fail('Legacy Bridge product name remains in learner-facing index.html.');\n",'source naming guard')

      - name: Commit final product copy cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- ':!.github/workflows/**'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No copy cleanup required.'; exit 0; }
          git commit -m "Finalize Normal B2–C2 product metadata"
          git push origin HEAD:v2-3-bridge-certification
