name: Build and verify dedicated practice screen

on:
  push:
    branches:
      - codex/dedicated-practice-screen
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artikelwerk-practice-screen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover editable application source
        run: python tools/recover_payload.py

      - name: Apply dedicated practice screen
        run: python tools/apply_practice_screen.py

      - name: Rebuild deterministic payload archive
        run: python tools/build_payload.py

      - name: Run static and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_practice_screen.py
          python -m py_compile tools/*.py
          node --check src/practice-screen.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class StrictEnoughParser(HTMLParser):
              pass

          source = Path('app-source.html').read_text(encoding='utf-8')
          StrictEnoughParser().feed(source)
          print('HTML parser check passed')
          PY

      - name: Install Playwright Chromium
        run: npm exec --yes --package=@playwright/test@1.55.0 -- playwright install --with-deps chromium

      - name: Run responsive browser tests
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/artikelwerk-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          ARTIKELWERK_TEST_URL=http://127.0.0.1:4173 \
            npm exec --yes --package=@playwright/test@1.55.0 -- \
            playwright test tests/practice-screen.spec.js --reporter=line --workers=1

      - name: Remove superseded recovery diagnostics
        run: rm -f partial-source.html source-index.txt source-metadata.txt

      - name: Publish generated source and payload to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-source.html payload/ recovery-report.txt payload-build-report.txt practice-screen-verification.txt
          git add -u partial-source.html source-index.txt source-metadata.txt || true
          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi
          git commit -m "build: publish dedicated fullscreen practice screen"
          git push
