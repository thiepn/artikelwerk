name: Patch v1.3 source contract

on:
  push:
    branches:
      - feature/mobile-article-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-article-controls
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update guarded source contract
        run: node scripts/patch-v130-source-contract.mjs
      - name: Commit source-contract update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-source.mjs
          git commit -m "Certify v1.3 article control source contract"
          git push origin HEAD:feature/mobile-article-controls
