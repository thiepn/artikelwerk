name: Audit German-English dictionary source

on:
  push:
    branches:
      - codex/dedicated-practice-screen
    paths:
      - .github/workflows/translation-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and inspect FreeDict German-English
        shell: bash
        run: |
          set -u
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dict dictd dict-freedict-deu-eng dictzip
          {
            echo '=== package metadata ==='
            apt-cache show dict-freedict-deu-eng | sed -n '1,80p'
            echo
            echo '=== installed files ==='
            dpkg -L dict-freedict-deu-eng
            echo
            echo '=== copyright/license ==='
            cat /usr/share/doc/dict-freedict-deu-eng/copyright 2>/dev/null || true
            echo
            echo '=== dictd databases ==='
            dictdconfig -l 2>&1 || true
            echo
            echo '=== dictionary samples ==='
          } > translation-audit.txt

          sudo dictdconfig -w >/dev/null 2>&1 || true
          sudo pkill dictd >/dev/null 2>&1 || true
          sudo dictd --listen-to 127.0.0.1 --locale C >/tmp/dictd.log 2>&1 &
          sleep 2
          for word in Aufwand Erkenntnis Bilanz Mangel Erbe Paradigmenwechsel Versäumnis; do
            {
              echo
              echo "--- $word ---"
              dict -h 127.0.0.1 -d fd-deu-eng "$word" 2>&1 || dict -h 127.0.0.1 "$word" 2>&1 || true
            } >> translation-audit.txt
          done
          echo >> translation-audit.txt
          echo '=== dictd log ===' >> translation-audit.txt
          cat /tmp/dictd.log >> translation-audit.txt 2>/dev/null || true
      - name: Commit audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translation-audit.txt
          git commit -m "chore: inspect offline translation source" || exit 0
          git push
