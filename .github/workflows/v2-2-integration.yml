name: Integrate V2-2 Bridge corpus

on:
  push:
    branches:
      - codex/v2-2-bridge-corpus
    paths:
      - scripts/v2-2-integrate.py
      - scripts/certify-bridge.mjs
      - tests/bridge-corpus.mjs
      - .github/workflows/v2-2-integration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artikelwerk-v2-2-integration
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply V2-2 runtime integration
        run: |
          python -m py_compile scripts/v2-2-integrate.py scripts/generate_bridge_corpus.py scripts/refine_bridge_corpus.py
          python scripts/v2-2-integrate.py

      - name: Install pinned browser-test runtime
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Verify source, Challenge, Bridge, and deterministic artifact
        run: npm run ci:static

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full nine-suite browser certification
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/artikelwerk-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:content-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:shell-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:surfaces-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:a11y-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:editorial-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:visual-acceptance-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:tracks-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:bridge-browser

      - name: Upload V2-2 browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: artikelwerk-v2-2-browser-evidence
          path: test-artifacts/v2-2/
          if-no-files-found: error
          retention-days: 14

      - name: Remove one-time integration script
        run: rm -f scripts/v2-2-integrate.py

      - name: Exclude one-time integration workflow from bot commit
        run: git checkout HEAD -- .github/workflows/v2-2-integration.yml .github/workflows/v2-2-corpus-generation.yml

      - name: Commit certified V2-2 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: install certified 1000-word Bridge corpus"
          git push origin HEAD:codex/v2-2-bridge-corpus
