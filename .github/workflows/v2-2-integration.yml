name: Certify V2-2 Bridge runtime

on:
  push:
    branches:
      - codex/v2-2-bridge-corpus
    paths:
      - index.html
      - bridge-corpus.js
      - bridge-translations.js
      - content/bridge-provenance.json
      - content/bridge-corpus-report.json
      - scripts/certify-bridge.mjs
      - scripts/verify-source.mjs
      - scripts/build.mjs
      - scripts/verify-dist.mjs
      - tests/bridge-corpus.mjs
      - package.json
      - .github/workflows/v2-2-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artikelwerk-v2-2-runtime-certification
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify generator syntax
        run: python -m py_compile scripts/generate_bridge_corpus.py scripts/refine_bridge_corpus.py scripts/generate_translations.py scripts/generate_translations_v2.py

      - name: Install pinned browser-test runtime
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Verify source, Challenge, Bridge, and deterministic artifact
        run: npm run ci:static

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full nine-suite browser certification
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/artikelwerk-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:content-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:shell-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:surfaces-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:a11y-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:editorial-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:visual-acceptance-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:tracks-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:bridge-browser

      - name: Upload V2-2 browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: artikelwerk-v2-2-browser-evidence
          path: test-artifacts/v2-2/
          if-no-files-found: error
          retention-days: 14
