name: Certify session completion and repeat fix

on:
  push:
    branches: [codex/session-finish-repeat-fix]
    paths:
      - scripts/apply_session_finish_fix.py
      - tests/session-completion.mjs
      - .github/workflows/session-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artikelwerk-session-finish-fix
  cancel-in-progress: true

jobs:
  certify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply session state-machine fix
        run: |
          python -m py_compile scripts/apply_session_finish_fix.py
          python scripts/apply_session_finish_fix.py

      - name: Install pinned browser runtime
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Verify source, content, and deterministic build
        run: npm run ci:static

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run existing regressions plus session-completion regression
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/artikelwerk-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:content-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:shell-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:surfaces-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:a11y-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:editorial-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:visual-acceptance-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 npm run test:tracks-browser
          ARTIKELWERK_URL=http://127.0.0.1:4173 node tests/session-completion.mjs

      - name: Upload session-fix evidence
        uses: actions/upload-artifact@v4
        with:
          name: artikelwerk-session-finish-evidence
          path: test-artifacts/session-completion/
          if-no-files-found: error
          retention-days: 14

      - name: Remove one-time patch/debug artifacts
        run: rm -f scripts/apply_session_finish_fix.py docs/session-debug-trigger.txt

      - name: Keep workflow files out of bot commit
        run: git checkout HEAD -- .github/workflows/session-debug.yml .github/workflows/session-fix.yml .github/workflows/ci.yml

      - name: Commit certified runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: finish completed sessions and bound reinforcement repeats"
          git push origin HEAD:codex/session-finish-repeat-fix
