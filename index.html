<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artikelwerk</title>
</head>
<body>
<script>
(async()=>{
  const files=Array.from({length:10},(_,i)=>`payload/${String(i).padStart(2,"0")}.txt`);
  const parts=await Promise.all(files.map(p=>fetch(p).then(r=>{
    if(!r.ok) throw new Error(`${p}: ${r.status}`);
    return r.text();
  })));
  const b64=parts.join("").trim();
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if(!("DecompressionStream" in window)) throw new Error("This browser does not support DecompressionStream.");
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  console.error(error);
  document.body.innerHTML="<main style='font:16px system-ui;padding:2rem'><h1>Artikelwerk</h1><p>Could not load the application.</p></main>";
});
</script>
</body>
</html>
